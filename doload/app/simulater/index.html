<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air &amp; Road Simulator</title>
<link rel="stylesheet" href="style.css?v=touch-turning">

<script>
if(location.protocol==='file:'){
 const originalFetch=window.fetch.bind(window);
 window.fetch=(input,options)=>{
  if(typeof input==='string'&&input.startsWith('/api/'))input='https://mywebsite-one-beta-41.vercel.app'+input;
  return originalFetch(input,options);
 };
}
</script><script defer src="../update.js"></script></head>
<body>
<div id="world" aria-hidden="true"></div>
<header><a href="../index.html">← AC</a><button id="garage" hidden>Change vehicle</button></header>
<main id="picker">
 <h1>Air &amp; Road Simulator</h1>
 <p>Pick a vehicle to explore the city or follow the checkpoints.</p>
 <div id="vehicles"></div>
 <p id="error" role="status"></p>
</main>
<section id="hud" hidden aria-label="Vehicle controls">
 <h1 id="vehicleName"></h1>
 <p id="telemetry"></p><p id="wind"></p><p id="online">Connecting…</p>
 <label for="health">Health <progress id="health"></progress> <span id="healthValue"></span></label>
 <p id="batteryMeter" hidden><label for="battery">Battery <progress id="battery" max="100" value="100"></progress> <span id="batteryValue">100%</span></label></p>
 <p id="controls"></p>
 <div class="buttons"><button id="camera">View · Chase</button><button id="reset">Reset vehicle</button><button id="course" aria-pressed="false">Start course</button><button id="hover" hidden aria-pressed="false">Hover · Space</button><button id="sound" aria-pressed="false">Sound: Off</button></div>
 <p id="raceStatus" role="status"></p>
</section>
<div id="touch" hidden aria-label="Touch controls">
 <div class="steering"><button data-key="w" aria-label="Forward">↑</button><button data-key="a" aria-label="Left">←</button><button data-key="s" aria-label="Reverse">↓</button><button data-key="d" aria-label="Right">→</button></div>
 <div class="turning" aria-label="Drone turning"><button data-key="arrowleft" aria-label="Turn left">↶</button><button data-key="arrowright" aria-label="Turn right">↷</button></div>
 <div class="altitude"><button id="climb" data-key="arrowup" aria-label="Climb">+</button><button id="descend" data-key="arrowdown" aria-label="Descend">−</button></div>
</div>
<dialog id="workshop" aria-labelledby="workshopTitle">
<h2 id="workshopTitle">Drone Workshop</h2>
<div id="workshopOptions"><button id="modifyDrone">Modify a drone</button> <button id="blankDrone">Create a drone</button></div>
<div id="workshopBench" hidden></div>
<button id="closeWorkshop">Back to vehicles</button>
</dialog>
