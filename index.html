<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="lights lights-left" aria-hidden="true"></div>
    <div class="games-title">AC</div>
    <div class="lights lights-right" aria-hidden="true"></div>
  </header>

  <main class="content">
    <a
      class="game-icon"
      href="game%201/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open corgi game"
    >
      <img src="assets/corgi-game.png" alt="Corgi game" />
    </a>
    <a
      class="game-icon"
      href="game%202/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open hamster game"
    >
      <img src="assets/hamster-game.png" alt="Hamster game" />
      <span class="start-btn">Start</span>
    </a>
    <a
      class="game-icon"
      href="game%203/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open hamster playground"
    >
      <img src="game%203/assets/cover.svg" alt="Hamster playground" />
    </a>
    <a
      class="game-icon"
      href="game%204/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open tunnel maze"
    >
      <img src="game%204/assets/cover.svg" alt="Tunnel maze" />
    </a>
    <a
      class="game-icon"
      href="https://scratch.mit.edu/projects/1378195931/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open The Invasion"
    >
      <img src="assets/the-invasion.png" alt="The Invasion" />
    </a>
    <a
      class="game-icon"
      href="website%201/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open HawkTech3D"
    >
      <img src="assets/website-1.svg" alt="HawkTech3D" />
      <span class="start-btn">Open</span>
    </a>
  </main>
  <audio id="backgroundMusic" src="assets/back-one-day.mp3" autoplay preload="metadata"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false">Play music</button>
  <script>
    (function () {
      const backgroundMusic = document.getElementById("backgroundMusic");
      const musicToggle = document.getElementById("musicToggle");
      const playlist = [
        "assets/back-one-day.mp3",
        "assets/pal.mp3",
        "assets/genshin-impact-main-theme.mp3",
        "assets/cycles.mp3",
        "assets/back-on-track.mp3"
      ];
      let currentTrack = 0;
      backgroundMusic.volume = 0.35;
      backgroundMusic.addEventListener("ended", function () {
        currentTrack = (currentTrack + 1) % playlist.length;
        backgroundMusic.src = playlist[currentTrack];
        playMusic();
      });

      function updateMusicButton() {
        const playing = !backgroundMusic.paused;
        musicToggle.textContent = playing ? "Music: On" : "Play music";
        musicToggle.setAttribute("aria-pressed", String(playing));
      }

      function playMusic() {
        musicToggle.textContent = "Loading music…";
        backgroundMusic.play().catch(function (error) {
          if (error.name === "NotAllowedError") {
            musicToggle.textContent = "Play music";
          } else {
            musicToggle.textContent = "Retry music";
          }
          musicToggle.setAttribute("aria-pressed", "false");
        });
      }

      backgroundMusic.addEventListener("playing", function () {
        removeMusicStartListeners();
        updateMusicButton();
      });
      backgroundMusic.addEventListener("pause", updateMusicButton);
      backgroundMusic.addEventListener("error", function () {
        musicToggle.textContent = "Music unavailable";
        musicToggle.setAttribute("aria-pressed", "false");
      });
      musicToggle.addEventListener("click", function () {
        removeMusicStartListeners();
        if (backgroundMusic.paused) {
          playMusic();
        } else {
          backgroundMusic.pause();
        }
      });

      function removeMusicStartListeners() {
        document.removeEventListener("click", startMusic);
        document.removeEventListener("keydown", startMusic);
      }

      function startMusic(event) {
        if (event.type === "keydown" &&
            (event.key === "Tab" || event.key === "Shift" ||
             event.key === "Control" || event.key === "Alt" || event.key === "Meta")) {
          return;
        }
        if (event.target.closest && event.target.closest("#musicToggle")) {
          return;
        }
        playMusic();
      }

      document.addEventListener("click", startMusic);
      document.addEventListener("keydown", startMusic);
      playMusic();
    })();
  </script>
</body>
</html>
