<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>games</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <h2>games</h2>
      <p>Enter the password to open the site.</p>
      <label class="lock-field">
        Password
        <input id="passwordInput" type="password" maxlength="24" placeholder="Password" autocomplete="off" />
      </label>
      <p class="lock-status" id="passwordStatus"></p>
      <button type="button" class="lock-btn" id="unlockBtn">Unlock</button>
    </div>
  </div>

  <header class="top-bar">
    <div class="lights lights-left" aria-hidden="true"></div>
    <div class="games-title">games</div>
    <div class="lights lights-right" aria-hidden="true"></div>
  </header>

  <main class="content">
    <a
      class="game-icon"
      href="game%201/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open corgi game"
    >
      <img src="assets/corgi-game.png" alt="Corgi game" />
    </a>
    <a
      class="game-icon"
      href="game%202/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open hamster game"
    >
      <img src="assets/hamster-game.png" alt="Hamster game" />
      <span class="start-btn">Start</span>
    </a>
    <a
      class="game-icon"
      href="game%203/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open hamster playground"
    >
      <img src="game%203/assets/cover.svg" alt="Hamster playground" />
    </a>
    <a
      class="game-icon"
      href="game%204/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open tunnel maze"
    >
      <img src="game%204/assets/cover.svg" alt="Tunnel maze" />
    </a>
    <a
      class="game-icon"
      href="https://scratch.mit.edu/projects/1378195931/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open The Invasion"
    >
      <img src="assets/the-invasion.png" alt="The Invasion" />
    </a>
  </main>
  <script>
    (function () {
      const PASSWORD = "game";
      const lockScreen = document.getElementById("lockScreen");
      const passwordInput = document.getElementById("passwordInput");
      const passwordStatus = document.getElementById("passwordStatus");
      const unlockBtn = document.getElementById("unlockBtn");

      function tryUnlock() {
        const typed = (passwordInput.value || "").trim().toLowerCase();
        if (typed === PASSWORD) {
          lockScreen.classList.add("is-hidden");
          passwordStatus.textContent = "";
          passwordInput.classList.remove("is-wrong");
          passwordInput.value = "";
          return;
        }
        passwordInput.classList.add("is-wrong");
        passwordStatus.textContent = "Wrong password.";
        passwordInput.focus();
        passwordInput.select();
      }

      unlockBtn.addEventListener("click", tryUnlock);
      passwordInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          tryUnlock();
        }
      });
      passwordInput.focus();
    })();
  </script>
</body>
</html>
