<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="lights lights-left" aria-hidden="true"></div>
    <div class="games-title">AC</div>
    <div class="lights lights-right" aria-hidden="true"></div>
  </header>

  <div class="credits-bar">
    <a class="credits-button" href="credits.html" target="_blank" rel="noopener noreferrer">Credits</a>
  </div>

  <main class="content">
    <a
      class="game-icon"
      href="game%201/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open corgi game"
    >
      <img src="assets/corgi-game.png" alt="Corgi game" />
    </a>
    <a
      class="game-icon"
      href="game%202/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open hamster game"
    >
      <img src="assets/hamster-game.png" alt="Hamster game" />
      <span class="start-btn">Start</span>
    </a>
    <a
      class="game-icon"
      href="game%203/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open hamster playground"
    >
      <img src="game%203/assets/cover.svg" alt="Hamster playground" />
    </a>
    <a
      class="game-icon"
      href="game%204/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open tunnel maze"
    >
      <img src="game%204/assets/cover.svg" alt="Tunnel maze" />
    </a>
    <a
      class="game-icon"
      href="https://scratch.mit.edu/projects/1378195931/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open The Invasion"
    >
      <img src="assets/the-invasion.png" alt="The Invasion" />
    </a>
    <a
      class="game-icon"
      href="website%201/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open HawkTech3D"
    >
      <img src="assets/website-1.svg" alt="HawkTech3D" />
      <span class="start-btn">Open</span>
    </a>
    <a class="game-icon" href="website%202/index.html" target="_blank" rel="noopener noreferrer" aria-label="Open ShapeLab AI picture to 3D generator">
      <img src="assets/website-2.svg" alt="ShapeLab AI 3D generator">
      <span class="start-btn">Open</span>
    </a>
    <a class="game-icon" href="roblox%20game%20test/index.html" target="_blank" rel="noopener noreferrer" aria-label="Open The Factory">
      <img src="roblox%20game%20test/cover.svg" alt="The Factory — factory building with glowing windows" />
      <span class="start-btn">Open</span>
    </a>
    <a class="game-icon" href="simulater/index.html" target="_blank" rel="noopener noreferrer" aria-label="Open Air and Road Simulator">
      <img src="simulater/cover.svg" alt="Air and Road Simulator with a drone and sports car" />
      <span class="start-btn">Open</span>
    </a>
  </main>
</body>
</html>
